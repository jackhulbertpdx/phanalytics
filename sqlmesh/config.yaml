
gateways:
  motherduck:
    connection:
      type: motherduck
      database: {{ env_var('MOTHERDUCK_DATABASE', 'phanalytics_dev') }}
      token: {{ env_var('MOTHERDUCK_TOKEN') }}
    state_connection:
      type: duckdb
      database: motherduck_state.db

default_gateway: motherduck

model_defaults:
  dialect: duckdb
  start: 2024-11-16


