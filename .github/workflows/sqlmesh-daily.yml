name: Daily ELT Job
run-name: 🧃 Daily ELT Job 🧃

on:
  schedule:
    - cron: '0 14 * * 1-5'  # 7am PST (14:00 UTC) Monday to Friday
  workflow_dispatch:  # Allow manual triggering

jobs:
  daily_elt:
    name: Daily ELT Process
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'  # Only run on the main branch
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install SQLMesh + Dependencies
        run: |
          pip install sqlmesh
          pip install snowflake-connector-python
          pip install duckdb
        shell: bash

      - name: Run SQLMesh
        run: |
          sqlmesh plan --config sqlmesh/config.yaml --force
          sqlmesh run --config sqlmesh/config.yaml --force
