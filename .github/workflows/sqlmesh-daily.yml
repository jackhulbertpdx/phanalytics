name: SQLMesh Daily Run
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
jobs:
  sqlmesh:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install sqlmesh 
        pip install "sqlmesh[snowflake]"
        sqlmesh init snowflake
        
    - name: Run SQLMesh
      run: |
        sqlmesh plan prod --y --force
      env:
        SNOWFLAKE_ACCOUNT: "fjhuipr-uf36774"
        SNOWFLAKE_USER: "JHULBERT"
        SNOWFLAKE_PASSWORD: "@Belknap123"
        SNOWFLAKE_DATABASE: "PHANALYTICS_DEV"
        SNOWFLAKE_WAREHOUSE: "AIRBYTE_WH"
        SNOWFLAKE_ROLE: "ACCOUNTADMIN"








