name: SQLMesh Daily Run

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  sqlmesh_run:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install sqlmesh
        pip install snowflake-connector-python

    - name: Debug environment
      run: |
        echo "Working directory: $(pwd)"
        echo "Config file location: $(pwd)/sqlmesh/config.yaml"
        echo "Config file exists: "
        ls -l sqlmesh/config.yaml
        echo "Config file contents: "
        cat sqlmesh/config.yaml
      
    - name: Run SQLMesh
      env:
        SQLMESH_CONFIG: ${{ github.workspace }}/sqlmesh/config.yaml
      run: |
        CONFIG_PATH="${GITHUB_WORKSPACE}/sqlmesh/config.yaml"
        echo "Using config path: $CONFIG_PATH"
        sqlmesh plan --config "$CONFIG_PATH" --force
        sqlmesh run --config "$CONFIG_PATH" --force
