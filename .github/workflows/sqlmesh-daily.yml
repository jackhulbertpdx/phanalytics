name: SQLMesh Daily Run
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
jobs:
  sqlmesh:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install sqlmesh
        
    - name: Initialize SQLMesh if needed
      run: |
        if [ ! -f "sqlmesh.yaml" ]; then
          sqlmesh init
          # Configure the sqlmesh.yaml file
          cat > sqlmesh.yaml <<EOL
        model_defaults:
          dialect: snowflake
        
        gateways:
          snowflake:
            connection:
              type: snowflake
              account: "fjhuipr-uf36774"
              user: "JHULBERT"
              password: "@Belknap123"
              database: "PHANALYTICS_DEV"
              warehouse: "AIRBYTE_WH"
              role: "ACCOUNTADMIN"
        
        default_gateway: snowflake
        EOL
        fi
        
    - name: Run SQLMesh
      run: |
        sqlmesh run --prod
      env:
        SNOWFLAKE_ACCOUNT: "fjhuipr-uf36774"
        SNOWFLAKE_USER: "JHULBERT"
        SNOWFLAKE_PASSWORD: "@Belknap123"
        SNOWFLAKE_DATABASE: "PHANALYTICS_DEV"
        SNOWFLAKE_WAREHOUSE: "AIRBYTE_WH"
        SNOWFLAKE_ROLE: "ACCOUNTADMIN"








