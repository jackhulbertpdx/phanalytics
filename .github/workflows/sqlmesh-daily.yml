name: SQLMesh Daily Run

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  sqlmesh_run:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install sqlmesh
        pip install snowflake-connector-python

    - name: Debug directory
      run: |
        echo "Current directory:"
        pwd
        echo "Directory contents:"
        ls -la
        echo "Config file contents exist:"
        test -f sqlmesh/config.yaml && echo "Yes" || echo "No"
      
    - name: Run SQLMesh
      run: |
        sqlmesh plan --config sqlmesh/config.yaml --force
        sqlmesh run --config sqlmesh/config.yaml --force
