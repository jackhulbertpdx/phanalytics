name: SQLMesh Daily Run

on:
  schedule:
    # Runs at 00:00 UTC every day
    - cron: '0 0 * * *'
  # Optionally allow manual triggers
  workflow_dispatch:

jobs:
  sqlmesh:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install sqlmesh
        # Add any other required dependencies
        
    - name: Run SQLMesh
    env:
      SQLMESH__GATEWAYS__SNOWFLAKE__CONNECTION__TYPE: "snowflake"
      SQLMESH__GATEWAYS__SNOWFLAKE__CONNECTION__ACCOUNT: "fjhuipr-uf36774"
      SQLMESH__GATEWAYS__SNOWFLAKE__CONNECTION__USER: "JHULBERT"
      SQLMESH__GATEWAYS__SNOWFLAKE__CONNECTION__PASSWORD: "@Belknap123"
      SQLMESH__GATEWAYS__SNOWFLAKE__CONNECTION__DATABASE: "PHANALYTICS_DEV"
      SQLMESH__GATEWAYS__SNOWFLAKE__CONNECTION__WAREHOUSE: "AIRBYTE_WH"
      SQLMESH__GATEWAYS__SNOWFLAKE__CONNECTION__ROLE: "ACCOUNTADMIN"
      SQLMESH__DEFAULT_GATEWAY: "snowflake"
      SQLMESH__MODEL_DEFAULTS__DIALECT: "snowflake"
      run: |
        sqlmesh run --prod






