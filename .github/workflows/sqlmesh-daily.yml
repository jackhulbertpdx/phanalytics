name: SQLMesh Daily Run

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  sqlmesh_run:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install sqlmesh
        pip install snowflake-connector-python
        pip install duckdb

    - name: Setup SQLMesh config
      env:
        SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
        SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
        SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
      run: |
        cat << EOF > config.yaml
        gateways:
          snowflake:
            connection:
              type: snowflake
              account: ${SNOWFLAKE_ACCOUNT}
              user: ${SNOWFLAKE_USER}
              password: ${SNOWFLAKE_PASSWORD}
              database: PHANALYTICS_DEV
              warehouse: AIRBYTE_WH
              role: ACCOUNTADMIN
            state_connection:
              type: duckdb
              database: snowflake_state.db
        default_gateway: snowflake
        model_defaults:
          dialect: snowflake
          start: 2024-11-16
        EOF
        
    - name: Run SQLMesh
      run: |
        sqlmesh plan --force
        sqlmesh run --force
